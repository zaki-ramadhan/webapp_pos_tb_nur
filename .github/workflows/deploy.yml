name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Webhook Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger deploy webhook
        run: |
          RESPONSE=$(curl -s -o /tmp/deploy_out.txt -w "%{http_code}" \
            "https://tb-nur.shop/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}")
          cat /tmp/deploy_out.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "Deploy failed with HTTP $RESPONSE"
            exit 1
          fi
          echo "✅ Deploy berhasil!"

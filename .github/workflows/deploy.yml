name: Build & Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Assets & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Commit and push compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): update compiled assets [skip ci]"
            git push
          fi

      - name: Trigger deploy webhook
        run: |
          RESPONSE=$(curl -s -o /tmp/deploy_out.txt -w "%{http_code}" \
            "https://tb-nur.shop/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}")
          cat /tmp/deploy_out.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "Deploy failed with HTTP $RESPONSE"
            exit 1
          fi
          echo "✅ Deploy berhasil!"
